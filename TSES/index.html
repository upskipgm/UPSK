<style>
/* ============================================================================

:root {

body {

.header-inner { max-width: 1152px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
.header-brand { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; background: none; border: none; }
.header-logo { width: 32px; height: 32px; background: var(--primary); color: var(--primary-fg); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }

/* Hero card (intro) */

.btn {

}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }

.btn-outline { background: transparent; border-color: var(--border); color: var(--fg); }

.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--fg); background: var(--muted-bg); }
.btn-lg { padding: 0.75rem 1.5rem; font-size: 1rem; }
.btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
.btn svg { width: 16px; height: 16px; }

/* Stepper */
.stepper { overflow-x: auto; padding: 0.5rem 0.25rem; }
.stepper ol { list-style: none; display: flex; align-items: center; gap: 0.25rem; min-width: max-content; }
.step-btn {

}

.step-btn.current { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.step-btn.done { border-color: rgba(13,148,136,0.4); background: rgba(13,148,136,0.05); }
.step-circle {
  width: 24px; height: 24px; border-radius: 9999px;

.step-btn.current .step-circle { background: rgba(255,255,255,0.2); color: var(--primary-fg); }

.step-btn:not(.current):not(.done) .step-circle { background: var(--muted-bg); color: var(--muted); }
.step-title { font-weight: 500; }
.step-count { font-size: 0.7rem; opacity: 0.8; }
.step-sep { width: 16px; height: 1px; background: var(--border); margin: 0 0.25rem; }
.step-progress { margin-top: 0.5rem; padding: 0 0.5rem; }

.step-progress-text { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }

.likert-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem; }
.likert-code {

}
.likert-statement { margin-top: 0.5rem; font-size: 0.9rem; line-height: 1.5; }
.likert-status { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
.likert-status.answered { color: var(--primary); font-weight: 500; }
.likert-anchors { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin: 0.75rem 0 0.5rem; }
.likert-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.375rem; }
.likert-btn {

  padding: 0.5rem 0.25rem; border-radius: 0.5rem;

  cursor: pointer; font-family: inherit; transition: all 0.1s;
  min-height: 48px;
}
.likert-btn:hover { border-color: var(--primary); background: rgba(13,148,136,0.05); }

.likert-num { font-size: 1.1rem; font-weight: 700; }
.likert-label { font-size: 0.65rem; text-align: center; margin-top: 0.125rem; line-height: 1.1; display: none; }

/* Demographics */
.demo-item { border: 1px solid var(--border); border-radius: 0.75rem; background: var(--card); padding: 1rem; margin-bottom: 0.75rem; }
.demo-item.answered { border-color: rgba(13,148,136,0.3); }
.demo-head { display: flex; align-items: flex-start; gap: 0.75rem; }
.demo-q { font-size: 0.9rem; font-weight: 500; flex: 1; }
.demo-options { margin-top: 0.75rem; padding-left: 2.75rem; }
.demo-radio-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
@media (min-width: 640px) { .demo-radio-grid { grid-template-columns: 1fr 1fr; } }
.demo-radio-label {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.625rem 0.75rem; border: 1px solid var(--border);

  transition: all 0.1s;
}
.demo-radio-label:hover { border-color: var(--primary); background: rgba(13,148,136,0.05); }
.demo-radio-label.checked { border-color: var(--primary); background: rgba(13,148,136,0.05); }
.demo-radio-label input[type="radio"] { accent-color: var(--primary); }
.demo-select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.875rem; font-family: inherit; background: var(--card); }
.demo-select:focus { outline: none; border-color: var(--primary); }
.demo-input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.875rem; font-family: inherit; margin-top: 0.5rem; }

/* Scale legend */
.scale-legend { background: rgba(13,148,136,0.05); border: 1px solid rgba(13,148,136,0.2); border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 1rem; }
.scale-legend-title { font-size: 0.8rem; font-weight: 600; color: var(--primary); }
.scale-legend-grid { display: grid; grid-template-columns: 1fr; gap: 0.25rem; margin-top: 0.5rem; font-size: 0.7rem; }
@media (min-width: 640px) { .scale-legend-grid { grid-template-columns: 1fr 1fr; } }
.scale-legend-item { display: flex; gap: 0.25rem; }
.scale-legend-num { font-family: monospace; font-weight: 700; color: var(--primary); }

/* Vignette */
.vignette { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); border-radius: 0.75rem; margin-bottom: 1rem; }
.vignette-body { padding: 1rem 1.25rem; }
.vignette-quote { border-left: 4px solid var(--accent); padding-left: 1rem; font-style: italic; font-size: 0.875rem; line-height: 1.6; color: var(--fg); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
.badge-primary { background: rgba(13,148,136,0.1); color: var(--primary); border: 1px solid rgba(13,148,136,0.2); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--accent-bg); color: #92400e; }
.badge-danger { background: var(--danger-bg); color: var(--danger); }

/* Progress bar */
.progress { height: 8px; background: var(--muted-bg); border-radius: 9999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #10b981); transition: width 0.3s; }
.progress-sm { height: 6px; }

/* Alerts */
.alert { border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 0.85rem; display: flex; gap: 0.75rem; align-items: flex-start; }
.alert-warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #92400e; }
.alert-danger { background: var(--danger-bg); border: 1px solid rgba(220,38,38,0.3); color: var(--danger); }

/* Consent checkbox */
.consent-box { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem; border: 1px solid var(--border); background: var(--muted-bg); border-radius: 0.75rem; cursor: pointer; }

/* Nav buttons */
.nav-buttons { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; gap: 1rem; flex-wrap: wrap; }
.nav-info { font-size: 0.75rem; color: var(--muted); text-align: center; flex: 1; }

/* Results */
.result-stat { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; }
.result-stat-label { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.result-stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
.result-stat-hint { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }

.result-construct { border: 1px solid var(--border); border-radius: 0.75rem; background: var(--card); margin-bottom: 1rem; overflow: hidden; }
.result-construct-head { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.result-construct-title { font-size: 1rem; font-weight: 700; margin-top: 0.5rem; }
.result-construct-percent { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-align: right; }
.result-construct-range { font-size: 0.75rem; color: var(--muted); }
.result-subscale { background: var(--muted-bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem; }
.result-subscale-label { font-size: 0.75rem; font-weight: 600; }
.result-subscale-value { font-size: 1.1rem; font-weight: 700; }

/* Bar chart (simple CSS bars) */
.bar-chart { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
.bar-row { display: flex; align-items: center; gap: 0.5rem; }
.bar-label { width: 80px; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
.bar-track { flex: 1; height: 24px; background: var(--muted-bg); border-radius: 0.25rem; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 0.25rem; transition: width 0.5s; display: flex; align-items: center; justify-content: flex-end; padding-right: 0.5rem; color: white; font-size: 0.7rem; font-weight: 700; }

/* Loading overlay */
.overlay { position: fixed; inset: 0; background: rgba(250,250,247,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--muted-bg); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }

/* Part cards (intro) */
.part-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-top: 0.75rem; }
@media (min-width: 640px) { .part-grid { grid-template-columns: 1fr 1fr; } }
.part-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--card); }
.part-badge { width: 36px; height: 36px; border-radius: 0.5rem; background: rgba(13,148,136,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.part-title { font-size: 0.85rem; font-weight: 500; }
.part-count { font-size: 0.7rem; color: var(--muted); }

/* Instructions list */
.instructions { list-style: none; margin-top: 0.75rem; }
.instructions li { display: flex; gap: 0.5rem; padding: 0.25rem 0; font-size: 0.875rem; color: var(--muted); }
.instructions li::before { content: "•"; color: var(--primary); font-weight: bold; }

/* Separator */
.separator { height: 1px; background: var(--border); margin: 1rem 0; }

/* Hidden */
.hidden { display: none !important; }

/* Scrollbar */
.nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.nice-scroll::-webkit-scrollbar-thumb { background: rgba(13,148,136,0.3); border-radius: 9999px; }
.nice-scroll::-webkit-scrollbar-track { background: transparent; }

/* Print */
@media print {
  .no-print { display: none !important; }
  body { background: white !important; }
  .header, .footer { display: none !important; }
}
</style>

/* ============================================================================
   LOGIK PENGIRAAN SKOR
   Item negatif: nilai_baharu = 8 − nilai_asal (skala 7-mata)
   ============================================================================ */

function scoreItem(item, raw){
  const v = Number(raw);
  if(!isFinite(v)) return 0;
  return item.rev ? (8 - v) : v;
}

function percentInRange(value, min, max){
  if(max === min) return 0;
  return Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
}

function findItem(code){
  for(const sec of SECTIONS){
    const f = sec.items.find(i => i.code === code);
    if(f) return f;
  }
  return null;
}

function interpretPercent(pct){
  if(pct < 33) return {label:"Rendah",tone:"low"};
  if(pct < 67) return {label:"Sederhana",tone:"mid"};
  return {label:"Tinggi",tone:"high"};
}

function scoreSection(section, answers){
  const subscales = section.subscales.map(sub => {
    const items = sub.codes.map(c => findItem(c)).filter(Boolean);
    const answered = items.filter(it => answers[it.code] !== undefined && answers[it.code] !== "");
    const sum = answered.reduce((a,it) => a + scoreItem(it, Number(answers[it.code])), 0);
    const mean = answered.length > 0 ? sum / answered.length : 0;
    return {key:sub.key,label:sub.label,sum,mean,min:sub.min,max:sub.max,itemCount:items.length,answeredCount:answered.length,percent:percentInRange(sum,sub.min,sub.max)};
  });
  const allItems = section.items;
  const answeredAll = allItems.filter(it => answers[it.code] !== undefined && answers[it.code] !== "");
  const globalSum = answeredAll.reduce((a,it) => a + scoreItem(it, Number(answers[it.code])), 0);
  const globalMean = answeredAll.length > 0 ? globalSum / answeredAll.length : 0;
  return {
    sectionKey:section.key,sectionLetter:section.letter,sectionTitle:section.title,
    subscales,
    global:{label:section.global.label,sum:globalSum,mean:globalMean,min:section.global.min,max:section.global.max,itemCount:allItems.length,percent:percentInRange(globalSum,section.global.min,section.global.max),answeredCount:answeredAll.length}
  };
}

function computeFullReport(answers){
  const sectionScores = SECTIONS.map(s => scoreSection(s, answers));
  const totalAnswered = sectionScores.reduce((a,s) => a + s.global.answeredCount, 0);
  const totalItems = SECTIONS.reduce((a,s) => a + s.items.length, 0);
  const averagePercent = sectionScores.length > 0 ? sectionScores.reduce((a,s) => a + s.global.percent, 0) / sectionScores.length : 0;
  return {sectionScores, overall:{totalAnswered,totalItems,completionRate: totalItems>0?(totalAnswered/totalItems)*100:0, averagePercent}};
}

function countAnsweredDemographics(answers){
  return DEMOGRAPHICS.filter(d => answers[d.code] !== undefined && answers[d.code] !== "").length;
}

function countAnsweredInSection(section, answers){
  return section.items.filter(it => answers[it.code] !== undefined && answers[it.code] !== "").length;
}

/* ============================================================================
   BINA BARIS SPREADSHEET (158 lajur)
   ============================================================================ */

function buildSheetRow(answers, participant, timestamp, report){
  const headers = [], values = [];
  const rep = report || computeFullReport(answers);
  const ts = typeof timestamp === "string" ? timestamp : new Date(timestamp).toISOString();

  // Meta
  headers.push("Timestamp","Kod Peserta","Jumlah Item Dijawab");
  values.push(ts, participant, rep.overall.totalAnswered);

  // Demografi
  for(const d of DEMOGRAPHICS){
    headers.push(d.code);
    const v = answers[d.code];
    values.push(v !== undefined && v !== "" ? String(v) : "");
  }

  // Skor mentah setiap item (97)
  for(const sec of SECTIONS){
    for(const item of sec.items){
      headers.push(item.code);
      const raw = answers[item.code];
      values.push(raw !== undefined && raw !== "" ? Number(raw) : "");
    }
  }

  // Skor songsang untuk item negatif (19)
  for(const sec of SECTIONS){
    for(const item of sec.items){
      if(item.rev){
        headers.push(item.code + "_R");
        const raw = answers[item.code];
        values.push(raw !== undefined && raw !== "" ? scoreItem(item, Number(raw)) : "");
      }
    }
  }

  // Jumlah subskala (21)
  for(const sec of SECTIONS){
    const secReport = rep.sectionScores.find(s => s.sectionKey === sec.key);
    for(const sub of sec.subscales){
      const subReport = secReport?.subscales.find(s => s.key === sub.key);
      headers.push(sec.key + "_" + sub.key + "_sum");
      values.push(subReport ? subReport.sum : "");
    }
  }

  // Jumlah global (7)
  const bRep = rep.sectionScores.find(s => s.sectionKey === "B");
  const cRep = rep.sectionScores.find(s => s.sectionKey === "C");
  const dRep = rep.sectionScores.find(s => s.sectionKey === "D");
  const eRep = rep.sectionScores.find(s => s.sectionKey === "E");
  const fRep = rep.sectionScores.find(s => s.sectionKey === "F");

  headers.push("B_global_sum");
  values.push(bRep ? bRep.global.sum : "");

  const cPresence = cRep?.subscales.filter(s => s.key.startsWith("P_")).reduce((a,s) => a + s.sum, 0);
  const cSearch = cRep?.subscales.filter(s => s.key.startsWith("S_")).reduce((a,s) => a + s.sum, 0);
  headers.push("C_presence_sum"); values.push(cPresence ?? "");
  headers.push("C_search_sum"); values.push(cSearch ?? "");
  headers.push("C_global_sum"); values.push(cRep ? cRep.global.sum : "");
  headers.push("D_global_sum"); values.push(dRep ? dRep.global.sum : "");
  headers.push("E_global_sum"); values.push(eRep ? eRep.global.sum : "");
  headers.push("F_global_sum"); values.push(fRep ? fRep.global.sum : "");

  return {headers, values};
}

  result: null,          // {participant, createdAt, scores, sheetSynced}

// Load from localStorage
function loadState(){
  try {
    const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed.answers && typeof parsed.answers === "object"){
        state.answers = parsed.answers;
        state.stepIndex = parsed.stepIndex || 0;
        state.consented = parsed.consented || false;
        // Don't restore stage — always start at intro
      }
    }
  } catch(e){ console.warn("Failed to load state:", e); }
}

function saveState(){
  try {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({
      answers: state.answers,
      stepIndex: state.stepIndex,
      consented: state.consented,
    }));
  } catch(e){ console.warn("Failed to save state:", e); }
}

function clearState(){
  try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch(e){}
}

    item.className = "demo-item" + (state.answers[d.code] !== undefined ? " answered" : "");

        <label class="demo-radio-label ${state.answers[d.code]===o.v?"checked":""}">

          <span>${o.l}</span>
        </label>
      `).join("")}</div>`;
    } else if(d.type === "select" && d.options){
      const isOther = String(state.answers[d.code] ?? "").startsWith("__other__:");
      const otherText = isOther ? String(state.answers[d.code]).replace("__other__:","") : "";
      optionsHTML = `
        <select class="demo-select" id="sel_${d.code}">
          <option value="">Sila pilih…</option>
          ${d.options.map(o => `<option value="${o.v}" ${state.answers[d.code]===o.v?"selected":""}>${o.l}</option>`).join("")}
          ${d.allowOther ? `<option value="__other__" ${isOther?"selected":""}>Lain-lain (nyatakan)…</option>` : ""}
        </select>
        ${isOther ? `<input type="text" class="demo-input" id="other_${d.code}" placeholder="Sila nyatakan…" value="${otherText}">` : ""}
      `;
    }

    item.innerHTML = `
      <div class="demo-head">
        <span class="likert-code">${d.code}</span>
        <div class="demo-q">${d.q}</div>
      </div>
      <div class="demo-options">${optionsHTML}</div>
    `;
    body.appendChild(item);

    // Bind events
    if(d.type === "radio"){
      item.querySelectorAll(`input[name="${d.code}"]`).forEach(input => {
        input.onchange = (e) => {
          state.answers[d.code] = e.target.value;
          item.classList.add("answered");
          item.querySelectorAll(".demo-radio-label").forEach(l => l.classList.remove("checked"));
          e.target.closest(".demo-radio-label").classList.add("checked");
          saveState();
          render();
        };
      });
    } else if(d.type === "select"){
      const sel = item.querySelector(`#sel_${d.code}`);
      sel.onchange = (e) => {
        if(e.target.value === "__other__"){
          state.answers[d.code] = "__other__:";
          item.classList.add("answered");
          // Add text input
          const input = document.createElement("input");
          input.type = "text";
          input.className = "demo-input";
          input.id = "other_" + d.code;
          input.placeholder = "Sila nyatakan…";
          input.oninput = (ev) => { state.answers[d.code] = "__other__:" + ev.target.value; saveState(); };
          item.querySelector(".demo-options").appendChild(input);
          input.focus();
        } else {
          state.answers[d.code] = e.target.value;
          item.classList.add("answered");
          const existingInput = item.querySelector(`#other_${d.code}`);
          if(existingInput) existingInput.remove();
        }
        saveState();
        render();
      };
      const otherInput = item.querySelector(`#other_${d.code}`);
      if(otherInput){
        otherInput.oninput = (e) => {
          state.answers[d.code] = "__other__:" + e.target.value;
          saveState();
        };
      }
    }
  });

  return card;
}

  const answeredCounts = [
    countAnsweredDemographics(state.answers),
    ...SECTIONS.map(s => countAnsweredInSection(s, state.answers))
  ];
  const totalAnswered = answeredCounts.reduce((a,b)=>a+b,0);
  const totalItems = steps.reduce((a,s)=>a+s.count,0);
  const completion = Math.round((totalAnswered/totalItems)*100);
  const incomplete = totalAnswered < totalItems;

  const main = document.createElement("main");
  main.className = "main main-narrow";
  main.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 Semakan Sebelum Penyerahan</div>
        <div class="card-desc">Pastikan semua item telah dijawab. Anda boleh kembali ke mana-mana bahagian untuk menyunting.</div>
      </div>
      <div class="card-body">
        <div style="background: var(--muted-bg); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.875rem; font-weight: 500;">Kemajuan keseluruhan</span>
            <span style="font-size: 0.875rem; font-weight: 700; color: var(--primary);">${totalAnswered} / ${totalItems} (${completion}%)</span>
          </div>
          <div class="progress" style="margin-top: 0.5rem;">
            <div class="progress-fill" style="width: ${completion}%"></div>
          </div>
          ${incomplete ? `<div class="alert alert-warning" style="margin-top: 0.75rem;"><div>⚠️ <strong>Terdapat item yang belum dijawab</strong><br><span style="font-size: 0.75rem;">Anda masih boleh menyerah, tetapi disyorkan menjawab semua item untuk ketepatan pengiraan skor.</span></div></div>` : ""}
        </div>

        <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
          ${steps.map((s,i) => {
            const c = answeredCounts[i];
            const pct = s.count > 0 ? Math.round((c/s.count)*100) : 0;
            const complete = c === s.count;
            return `<button class="step-btn ${complete?"done":""}" data-step="${i}" style="width: 100%; justify-content: flex-start; text-align: left;">
              <span class="step-circle">${complete?"✓":s.letter}</span>
              <span style="flex: 1;">
                <div class="step-title">${s.title}</div>
                <div class="step-count">${c}/${s.count} item (${pct}%)</div>
              </span>
              <div style="width: 96px;"><div class="progress progress-sm"><div class="progress-fill" style="width: ${pct}%; background: ${complete?"var(--success)":pct>0?"var(--primary)":"var(--muted)"};"></div></div></div>
              <span style="color: var(--muted);">→</span>
            </button>`;
          }).join("")}
        </div>

        ${state.syncError ? `<div class="alert alert-danger" style="margin-top: 1rem;"><div>⚠️ <strong>Penyerahan gagal</strong><br><span style="font-size: 0.75rem;">${state.syncError}</span></div></div>` : ""}
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-outline" id="backBtn">← Kembali ke Soalan</button>
      <button class="btn btn-primary btn-lg" id="submitBtn">📤 Serahkan Soal Selidik</button>
    </div>
  `;
  app.appendChild(main);
  renderFooter();

  document.querySelectorAll(".step-btn[data-step]").forEach(btn => {
    btn.onclick = () => {
      state.stepIndex = parseInt(btn.dataset.step);
      state.stage = "survey";
      scrollToTop();
      render();
    };
  });
  document.getElementById("backBtn").onclick = () => {
    state.stepIndex = steps.length - 1;
    state.stage = "survey";
    scrollToTop();
    render();
  };
  document.getElementById("submitBtn").onclick = handleSubmit;
}

/* ---------- Submit handler ---------- */
async function handleSubmit(){
  state.stage = "submitting";
  render();

  try {
    const participant = generateParticipantCode();
    const report = computeFullReport(state.answers);
    const timestamp = new Date().toISOString();
    const row = buildSheetRow(state.answers, participant, timestamp, report);

    let sheetSynced = false;
    let syncError = null;

    if(CONFIG.APPS_SCRIPT_URL){
      try {
        const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: "POST",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({headers: row.headers, values: row.values}),
        });
        const text = await res.text();
        try {
          const result = JSON.parse(text);
          sheetSynced = result.success === true;
          if(!sheetSynced) syncError = result.error || "Sync gagal";
        } catch {
          sheetSynced = false;
          syncError = "Apps Script mengembalikan respons bukan JSON (deployment mungkin versi lama)";
        }
      } catch(e){
        sheetSynced = false;
        syncError = e.message;
      }
    } else {
      syncError = "APPS_SCRIPT_URL tidak dikonfigurasi";
    }

    state.result = {participant, createdAt: timestamp, scores: report, sheetSynced};
    state.syncError = syncError;
    state.stage = "results";
    clearState(); // Clear localStorage after successful submit
    scrollToTop();
    render();
  } catch(e){
    state.syncError = e.message;
    state.stage = "review";
    render();
  }
}

/* ---------- Reset ---------- */
function resetAll(){
  state.stage = "intro";
  state.answers = {};
  state.stepIndex = 0;
  state.result = null;
  state.syncError = null;
  clearState();
  scrollToTop();
  render();
}

/* ---------- Init ---------- */
function init(){
  loadState();
  if(state.stage === "submitting") state.stage = "review";
  render();
}

init();
