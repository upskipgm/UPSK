// Flatten all Likert items for counting/validation
const ALL_ITEMS = SECTIONS.flatMap(s => s.subscales.flatMap(sub => sub.items.map(it => ({code:it.code, sectionId:s.id, neg:!!it.neg}))));
const STEP_IDS = ["intro","A",...SECTIONS.map(s=>s.id)];

function countSectionItems(sid){
  const s = SECTIONS.find(x=>x.id===sid);
  if(!s) return 0;
  return s.subscales.reduce((a,sub)=>a+sub.items.length,0);
}

/* ================================================================
 * 2. SCORING LOGIC
 * ================================================================ */

function reverseScore(raw){ return 8 - raw; }

function computeScores(responses){
  const sections = [];
  for(const section of SECTIONS){
    const subscaleResults = [];
    let secTotal=0, secCount=0;
    for(const sub of section.subscales){
      let st=0, sc=0;
      for(const item of sub.items){
        const raw = responses[item.code];
        if(raw==null || isNaN(raw)) continue;
        const scored = item.neg ? reverseScore(raw) : raw;
        st += scored; sc++;
      }
      subscaleResults.push({title:sub.title, total:st, itemCount:sc, range:[sub.items.length, sub.items.length*7], mean:sc>0?st/sc:0});
      secTotal += st; secCount += sc;
    }
    const total = section.subscales.reduce((a,sub)=>a+sub.items.length,0);
    sections.push({sectionId:section.id, title:section.title, total:secTotal, itemCount:secCount, range:[total,total*7], mean:secCount>0?secTotal/secCount:0, subscales:subscaleResults});
  }
  const grandTotal = sections.reduce((a,s)=>a+s.total,0);
  const grandItemCount = sections.reduce((a,s)=>a+s.itemCount,0);
  return {sections, grandTotal, grandItemCount};
}

function levelFromMean(mean){
  if(mean>=5.5) return {label:"Tinggi", color:"text-emerald-700", bg:"bg-emerald-100"};
  if(mean>=4.5) return {label:"Sederhana Tinggi", color:"text-teal-700", bg:"bg-teal-100"};
  if(mean>=3.5) return {label:"Sederhana", color:"text-amber-700", bg:"bg-amber-100"};
  if(mean>=2.5) return {label:"Sederhana Rendah", color:"text-orange-700", bg:"bg-orange-100"};
  return {label:"Rendah", color:"text-rose-700", bg:"bg-rose-100"};
}

let toastTimer = null;
function toast(msg, type){
  type = type || "info";
  const colors = {success:"bg-emerald-600",error:"bg-rose-600",warning:"bg-amber-600",info:"bg-gray-800"};
  const el = document.getElementById("toast");
  if(!el) return;
  el.className = "fixed top-4 left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-lg text-white text-sm font-medium shadow-lg transition-all duration-300 " + (colors[type]||colors.info);
  el.textContent = msg;
  el.style.opacity = "1";
  el.style.transform = "translate(-50%,0)";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translate(-50%,-12px)"; }, 4000);
}

async function testSettingsUrl(){
  const inputUrl = (document.getElementById("sheet-url-input").value||"").trim();
  const url = inputUrl || getWebhookUrl();
  if(!url){ toast("Tiada URL untuk diuji. Sila tampal URL Web App dahulu.","error"); return; }

  if(resultEl) resultEl.innerHTML = `<div class="rounded-lg border border-gray-200 bg-gray-50 p-2.5 text-xs text-gray-500">Menguji sambungan…</div>`;
  try{
    // Use no-cors for browser→Apps Script (avoids preflight); can't read response but request goes through.
    const headers = buildSheetColumns();
    await fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({type:"init", headers})});
    if(resultEl) resultEl.innerHTML = `<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-2.5 text-xs text-emerald-700">Sambungan berjaya! Header lajur telah ditulis ke baris 1 Google Sheet anda.</div>`;

    toast("Sambungan gagal.","error");
  }
}

/* ================================================================
 * 8. GOOGLE SHEET SYNC
 * ================================================================ */

function buildSheetColumns(){
  return ["Timestamp","SubmissionID", ...DEMOGRAPHICS.map(q=>q.code), ...ALL_ITEMS.map(i=>i.code), ...SECTIONS.map(s=>"Total_"+s.id), "GrandTotal","GrandMean"];
}

function buildSheetRow(submissionId, demographics, responses){
  const {sections, grandTotal, grandItemCount} = computeScores(responses);
  const grandMean = grandItemCount>0 ? grandTotal/grandItemCount : 0;
  const demoVals = DEMOGRAPHICS.map(q=>demographics[q.code]||"");
  const itemVals = ALL_ITEMS.map(i=>responses[i.code]||"");
  const secTotals = SECTIONS.map(s=>{const sec=sections.find(x=>x.sectionId===s.id);return sec?sec.total:"";});
  return [new Date().toISOString(), submissionId, ...demoVals, ...itemVals, ...secTotals, grandTotal, Number(grandMean.toFixed(3))];
}

async function pushToGoogleSheet(submissionId, demographics, responses){
  const url = getWebhookUrl();
  if(!url) return {synced:false, skipped:true};
  const headers = buildSheetColumns();
  const row = buildSheetRow(submissionId, demographics, responses);
  try{
    // no-cors: request goes through, response is opaque. Data reaches Apps Script.
    await fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({headers, row})});
    return {synced:true};
  }catch(e){
    return {synced:false, error:e.message||"sync error"};
  }
}

function setDemo(code, val){ state.demographics[code] = val; saveState(); render(); }
function setDemoOther(code, text){ state.demographics[code] = "Lain-lain: " + text; saveState(); /* don't full re-render to keep focus */ }
function setResp(code, val){ state.responses[code] = val; saveState(); render(); }
function goToStep(step){
  const idx = STEP_IDS.indexOf(step);
  state.currentStep = step;
  state.maxReachedIndex = Math.max(state.maxReachedIndex, idx);
  saveState();
  render();
}
function nextStep(){
  const idx = STEP_IDS.indexOf(state.currentStep);
  if(idx < STEP_IDS.length-1) goToStep(STEP_IDS[idx+1]);
}
function prevStep(){
  const idx = STEP_IDS.indexOf(state.currentStep);
  if(idx > 0) goToStep(STEP_IDS[idx-1]);
}
function toggleSection(idx){
  const el = document.getElementById("sec-"+idx);
  if(el) el.classList.toggle("hidden");
}
function resetSurvey(){
  state = {currentStep:"intro", demographics:{}, responses:{}, submitted:false, submittedId:null, maxReachedIndex:0, submitting:false, sheetSynced:false, sheetError:null};
  saveState();
  render();
}

function validateStep(step){
  if(step==="intro") return {ok:true};
  if(step==="A"){
    const missing = DEMOGRAPHICS.filter(q=>!(state.demographics[q.code]||"").trim()).length;
    return missing===0 ? {ok:true} : {ok:false, missing};
  }
  const section = SECTIONS.find(s=>s.id===step);
  if(!section) return {ok:true};
  const codes = section.subscales.flatMap(sub=>sub.items.map(i=>i.code));
  const missing = codes.filter(c=>state.responses[c]==null).length;
  return missing===0 ? {ok:true} : {ok:false, missing};
}

function handleNext(){
  const r = validateStep(state.currentStep);
  if(!r.ok){
    toast(r.missing===1?"Masih ada 1 soalan yang belum dijawab di bahagian ini.":`Masih ada ${r.missing} soalan yang belum dijawab di bahagian ini.`,"error");
    return;
  }
  nextStep();
}

async function handleSubmit(){
  const r = validateStep(state.currentStep);
  if(!r.ok){
    toast(r.missing===1?"Masih ada 1 soalan yang belum dijawab.":`Masih ada ${r.missing} soalan yang belum dijawab.`,"error");
    return;
  }
  state.submitting = true;
  render();
  // Generate submission ID
  const submissionId = "sub-" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  // Push to Google Sheet if configured
  const syncResult = await pushToGoogleSheet(submissionId, state.demographics, state.responses);
  state.sheetSynced = syncResult.synced;
  state.sheetError = syncResult.error || null;
  state.submitted = true;
  state.submittedId = submissionId;
  state.submitting = false;
  saveState();
  render();
  if(syncResult.synced){
    toast("Soal selidik dihantar & direkod ke Google Sheet.","success");
  } else if(syncResult.skipped){
    toast("Soal selidik berjaya dihantar (disimpan tempatan).","success");
  } else {
    toast("Disimpan tempatan. Google Sheet tidak berjaya disegerakkan.","warning");
  }
}

/* ================================================================
 * 10. EVENT ATTACHMENT (after innerHTML)
 * ================================================================ */

function attachIntroEvents(){}
function attachSurveyEvents(){}
function attachThankYouEvents(){}

/* ================================================================
 * 11. INIT
 * ================================================================ */

loadState();
render();

// Expose for inline onclick handlers
window.setDemo = setDemo;
window.setDemoOther = setDemoOther;
window.setResp = setResp;
window.goToStep = goToStep;
window.handleNext = handleNext;
window.prevStep = prevStep;
window.handleSubmit = handleSubmit;
window.toggleSection = toggleSection;
window.resetSurvey = resetSurvey;
window.openSettings = openSettings;
window.closeSettings = closeSettings;
window.saveSettingsUrl = saveSettingsUrl;
window.testSettingsUrl = testSettingsUrl;
window.deleteSettingsUrl = deleteSettingsUrl;
</script>
