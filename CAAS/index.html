const ALL_ITEMS = SECTIONS.flatMap(s => s.subscales.flatMap(sub => sub.items.map(it => ({...it, sectionId: s.id}))));
const ITEM_MAP = ALL_ITEMS.reduce((acc, it) => { acc[it.code] = it; return acc; }, {});
const TOTAL_LIKERT_ITEMS = ALL_ITEMS.length;
const STEP_IDS = ["intro","A","B","C","D","E","F","done"];

/* -------------------------- Scoring functions ----------------------------- */
function reverseScore(raw){ return 8 - raw; }

function sectionGlobalRange(sectionId){
  const sec = SECTIONS.find(s => s.id === sectionId);
  const total = sec.subscales.reduce((a,sub)=>a+sub.items.length, 0);
  return [total, total*7];
}

function computeScores(responses){
  const sections = [];
  for (const section of SECTIONS){
    const subscaleResults = [];
    let secTotal = 0, secCount = 0;
    for (const sub of section.subscales){
      let st=0, sc=0;
      for (const item of sub.items){
        const raw = responses[item.code];
        if (raw == null || Number.isNaN(raw)) continue;
        const scored = item.negative ? reverseScore(raw) : raw;
        st += scored; sc += 1;
      }
      subscaleResults.push({
        title: sub.title, total: st, itemCount: sc,
        range: [sub.items.length, sub.items.length*7],
        mean: sc>0 ? st/sc : 0,
      });
      secTotal += st; secCount += sc;
    }
    const [min,max] = sectionGlobalRange(section.id);
    sections.push({
      sectionId: section.id, title: section.title,
      total: secTotal, itemCount: secCount, range:[min,max],
      mean: secCount>0 ? secTotal/secCount : 0,
      subscales: subscaleResults,
    });
  }
  const grandTotal = sections.reduce((a,s)=>a+s.total, 0);
  const grandItemCount = sections.reduce((a,s)=>a+s.itemCount, 0);
  return { sections, grandTotal, grandItemCount };
}

function levelFromMean(mean){
  if (mean >= 6)     return { label:"Tinggi",            color:"text-emerald-700", bg:"bg-emerald-100 border-emerald-300" };
  if (mean >= 5)     return { label:"Sederhana Tinggi",  color:"text-emerald-600", bg:"bg-emerald-50 border-emerald-200" };
  if (mean >= 4)     return { label:"Sederhana",         color:"text-teal-700",    bg:"bg-teal-50 border-teal-200" };
  if (mean >= 3)     return { label:"Sederhana Rendah",  color:"text-amber-700",   bg:"bg-amber-50 border-amber-200" };
  if (mean > 0)      return { label:"Rendah",            color:"text-rose-700",    bg:"bg-rose-50 border-rose-200" };
  return { label:"Tidak Dijawab", color:"text-slate-500", bg:"bg-slate-50 border-slate-200" };
}

const SLIP_SECTION_SHORT = {
  B: "Identiti Profesional Guru",
  C: "Panggilan Kerjaya Guru",
  D: "Resiliensi (ARS-30)",
  E: "Kesejahteraan Psikologi",
  F: "Efikasi Kendiri Kerjaya",
};

function slipLevelColor(mean){
  if (mean >= 4.5) return "#059669"; // emerald-600
  if (mean >= 3.5) return "#d97706"; // amber-600
  return "#dc2626";                  // rose-600
}

function slipFormatDate(d){
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

  const now = new Date();

      if (other) val = val + ": " + other;

    return '<tr><td class="code">' + q.code + '</td><td class="label">' + escapeHtml(q.question) + '</td><td class="value">' + escapeHtml(v) + '</td></tr>';

function downloadSlip(){
  try {
    const html = buildSlipHTML(state.demographics, state.responses, state.submissionId);
    const win = window.open("", "_blank");
    if (!win){
      alert("Sila benarkan tetingkap pop-up untuk memuat turun slip keputusan.");

    }
    win.document.write(html);
    win.document.close();
    win.focus();
    // Slight delay to ensure content is rendered before printing
    setTimeout(() => { try { win.print(); } catch(e){} }, 500);
  } catch(err){
    alert("Gagal menjana slip keputusan: " + (err && err.message ? err.message : String(err)));
  }
}

const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxY1YBI6Y8PC7YbZKy0z4cFDRJB1J0BZNkT4MvQgebf3ciXNcCjdBFY_6MfURaFphRw/exec";
const LS_WEBHOOK_KEY = "soal-selidik-webhook-url-v4";
function getWebhookUrl(){
  try {
    const v = localStorage.getItem(LS_WEBHOOK_KEY);
    return (v && v.trim()) ? v.trim() : DEFAULT_WEBHOOK_URL;
  } catch(e){ return DEFAULT_WEBHOOK_URL; }
}
function setWebhookUrl(url){
  try { if (url && url.trim()) localStorage.setItem(LS_WEBHOOK_KEY, url.trim()); } catch(e){}
}
function clearWebhookUrl(){
  try { localStorage.removeItem(LS_WEBHOOK_KEY); } catch(e){}
}

/* 115 columns: ["Timestamp","SubmissionID", A1-A9 (9), 97 item codes,
   Total_B..F (5), "GrandTotal","GrandMean"] */
function buildSheetColumns(){
  const cols = ["Timestamp","SubmissionID"];
  for (const d of DEMOGRAPHICS) cols.push(d.code);
  for (const it of ALL_ITEMS) cols.push(it.code);
  for (const s of SECTIONS) cols.push("Total_" + s.id);
  cols.push("GrandTotal","GrandMean");
  return cols; // 2 + 9 + 97 + 5 + 2 = 115
}

function buildSheetRow(submissionId, demographics, responses){
  const row = [];
  row.push(new Date().toISOString());
  row.push(submissionId);
  for (const d of DEMOGRAPHICS){
    let v = demographics[d.code] || "";
    if (d.hasOther && isLainLainChoice(v)){
      const o = demographics[d.code + "_other"];
      if (o) v = v + ": " + o;
    }
    row.push(v);
  }
  for (const it of ALL_ITEMS){
    const raw = responses[it.code];
    if (raw == null) { row.push(""); continue; }
    row.push(it.negative ? reverseScore(raw) : raw);
  }
  const scores = computeScores(responses);
  for (const s of SECTIONS){
    const sec = scores.sections.find(x => x.sectionId === s.id);
    row.push(sec ? sec.total : 0);
  }
  row.push(scores.grandTotal);
  const gm = scores.grandItemCount>0 ? (scores.grandTotal/scores.grandItemCount).toFixed(3) : "0";
  row.push(gm);
  return row; // 115 values
}

async function syncToSheet(submissionId, demographics, responses){
  const url = getWebhookUrl();
  if (!url) return { ok:false, error:"URL webhook tidak ditetapkan." };
  const headers = buildSheetColumns();
  const row = buildSheetRow(submissionId, demographics, responses);
  try {
    await fetch(url, {
      method:"POST",
      mode:"no-cors",
      headers: { "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ headers, row }),
    });
    return { ok:true };
  } catch(e){
    return { ok:false, error: String(e) };
  }
}

/* ------------------------------ Toasts ------------------------------------ */
function toast(msg, type="info"){
  const el = document.createElement("div");
  const colors = {
    info:    "bg-slate-800 text-white",
    success: "bg-emerald-600 text-white",
    warn:    "bg-amber-500 text-white",
    error:   "bg-rose-600 text-white",
  };
  const icon = {
    info: svgIcon("alertTriangle","w-5 h-5 shrink-0"),
    success: svgIcon("checkCircle","w-5 h-5 shrink-0"),
    warn: svgIcon("alertTriangle","w-5 h-5 shrink-0"),
    error: svgIcon("xCircle","w-5 h-5 shrink-0"),
  }[type] || "";
  el.className = "pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-lg shadow-lg " + (colors[type]||colors.info) + " animate-pop-in";
  el.innerHTML = icon + '<span class="text-sm font-medium">' + msg + '</span>';
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity 0.3s, transform 0.3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    setTimeout(()=>el.remove(), 300);
  }, 4000);
}

/* ----------------------- Stepper & progress helpers ----------------------- */
function sectionItemCount(sectionId){
  const sec = SECTIONS.find(s=>s.id===sectionId);
  if (!sec) return 0;
  return sec.subscales.reduce((a,sub)=>a+sub.items.length, 0);
}
function sectionAnsweredCount(sectionId){
  const sec = SECTIONS.find(s=>s.id===sectionId);
  if (!sec) return 0;
  let n = 0;
  for (const sub of sec.subscales) for (const it of sub.items) if (state.responses[it.code] != null) n++;
  return n;
}
function totalAnsweredCount(){ return Object.keys(state.responses).filter(k => state.responses[k] != null).length; }

function demographicsAnsweredCount(){
  let n = 0;
  for (const d of DEMOGRAPHICS){
    if (state.demographics[d.code] != null && state.demographics[d.code] !== "") n++;
  }
  return n;
}

function isDemographicComplete(){
  for (const d of DEMOGRAPHICS){
    const v = state.demographics[d.code];
    if (v == null || v === "") return false;
    if (d.hasOther && isLainLainChoice(v)){
      const o = state.demographics[d.code + "_other"];
      if (!o || !o.trim()) return false;
    }
  }
  return true;
}
function isSectionComplete(sectionId){
  return sectionAnsweredCount(sectionId) === sectionItemCount(sectionId);
}

/* --------------------------- Demographics body ---------------------------- */
function renderDemographicsBody(){
  let html = `
    <div class="bg-white rounded-xl border border-emerald-100 shadow-sm p-5 sm:p-6 mb-4">
      <div class="flex gap-3 mb-4">
        <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">${svgIcon("fileText","w-5 h-5")}</div>

          <h3 class="font-semibold text-slate-900">Maklumat Demografi</h3>
          <p class="text-sm text-slate-500">Sila lengkapkan semua maklumat di bawah. Jawapan anda dirahsiakan.</p>
        </div>
      </div>
    </div>
  `;
  for (const d of DEMOGRAPHICS){
    html += renderDemographicQuestion(d);
  }
  return html;
}

function renderDemographicQuestion(d){
  const v = state.demographics[d.code] || "";
  const otherV = state.demographics[d.code + "_other"] || "";
  let control = "";

  if (d.type === "radio"){
    control = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${d.options.map(o => {
      const active = v === o.key;
      return `<button type="button" data-demo-radio="${d.code}" data-value="${o.key}" class="radio-card text-left px-3.5 py-2.5 rounded-lg border text-sm transition ${active ? 'bg-emerald-50 border-emerald-400 ring-2 ring-emerald-100 text-emerald-800' : 'bg-white border-slate-200 hover:border-emerald-300 text-slate-700'}">
        <span class="flex items-center gap-2">
          <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ${active ? 'border-emerald-500' : 'border-slate-300'}">
            ${active ? '<span class="w-2 h-2 rounded-full bg-emerald-500"></span>' : ''}
          </span>
          <span>${o.label}</span>
        </span>
      </button>`;
    }).join("")}</div>`;
  } else if (d.type === "select"){
    const opts = (d.options||[]).map(o => `<option value="${o.key}" ${v===o.key?"selected":""}>${o.label}</option>`).join("");
    control = `<select data-demo="${d.code}" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none text-sm bg-white"><option value="">— Sila pilih —</option>${opts}</select>`;
  } else {
    control = `<input type="text" data-demo="${d.code}" value="${escapeHtml(v)}" placeholder="${d.placeholder||""}" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none text-sm" />`;
  }

  let other = "";
  if (d.hasOther && isLainLainChoice(v)){
    other = `<div class="mt-2"><input type="text" data-demo="${d.code}_other" value="${escapeHtml(otherV)}" placeholder="Sila nyatakan" class="w-full px-3 py-2.5 rounded-lg border border-amber-200 bg-amber-50/40 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none text-sm" /></div>`;
  }

  return `
    <div class="bg-white rounded-xl border border-emerald-100 shadow-sm p-5 mb-3" data-demo-block="${d.code}">
      <div class="flex items-start gap-2 mb-3">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-md bg-emerald-600 text-white text-xs font-bold shrink-0">${d.code.slice(1)}</span>
        <label class="block text-sm font-semibold text-slate-800 pt-0.5">${d.question}</label>
      </div>
      ${control}
      ${other}
    </div>
  `;
}

            <div class="text-base font-bold text-emerald-700">${i+1}</div>
            <div class="text-[10px] sm:text-[11px] leading-tight text-slate-600 mt-1">${p}</div>

  for (const sub of section.subscales){
    html += `
      <div class="bg-white rounded-xl border border-emerald-100 shadow-sm p-4 sm:p-5 mb-4">

        <span><strong>Sumber:</strong> ${section.source}</span>
      </div>
    `;
  }

  return html;
}

function renderItemRow(it, section){
  const v = state.responses[it.code];
  const points = section.scaleLabels.points;
  return `
    <div class="likert-item" data-item-code="${it.code}">

}

/* ============================================================================
   INTERACTION (setResp / setDemo) — targeted DOM updates to preserve scroll
   ========================================================================== */

function setResp(code, value){
  state.responses[code] = value;
  saveState();
  updateItemPills(code, value);
  updateHeaderProgress();
  updateStepperCounts();
}

function updateItemPills(code, value){
  const row = document.querySelector('[data-item-code="'+code+'"]');
  if (!row) return;
  row.querySelectorAll('[data-pill]').forEach(btn => {
    const v = parseInt(btn.getAttribute("data-value"), 10);
    if (v === value){
      btn.classList.add("pill-active","bg-emerald-600","text-white","border-emerald-600");
      btn.classList.remove("bg-white","text-slate-600","border-slate-200");
    } else {
      btn.classList.remove("pill-active","bg-emerald-600","text-white","border-emerald-600");
      btn.classList.add("bg-white","text-slate-600","border-slate-200");
    }
  });
}

function setDemo(code, value){
  state.demographics[code] = value;
  saveState();
  updateHeaderProgress();
  updateStepperCounts();
  const d = DEMOGRAPHICS.find(x => x.code === code);
  if (!d) return;

  // For radio/select with hasOther: toggle "Lain-lain" follow-up input
  if (d.hasOther){
    const block = document.querySelector('[data-demo-block="'+code+'"]');
    if (block){
      const existing = block.querySelector('[data-demo="'+code+'_other"]');
      if (isLainLainChoice(value) && !existing){
        const wrap = document.createElement("div");
        wrap.className = "mt-2";
        wrap.innerHTML = `<input type="text" data-demo="${code}_other" value="" placeholder="Sila nyatakan" class="w-full px-3 py-2.5 rounded-lg border border-amber-200 bg-amber-50/40 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none text-sm" />`;
        block.appendChild(wrap);
        wrap.querySelector("input").focus();
        wireDemoInputs(wrap);
      } else if (!isLainLainChoice(value) && existing){
        existing.parentElement.remove();
        state.demographics[code + "_other"] = "";
        saveState();
      }
    }
  }
}

function updateRadioCards(code){
  const block = document.querySelector('[data-demo-block="'+code+'"]');
  if (!block) return;
  const v = state.demographics[code];
  block.querySelectorAll('[data-demo-radio]').forEach(btn => {
    const val = btn.getAttribute("data-value");
    const dot = btn.querySelector("span > span");
    if (val === v){
      btn.classList.add("bg-emerald-50","border-emerald-400","ring-2","ring-emerald-100","text-emerald-800");
      btn.classList.remove("bg-white","border-slate-200","text-slate-700");
      if (dot){
        dot.classList.remove("border-slate-300");
        dot.classList.add("border-emerald-500");
        dot.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span>';
      }
    } else {
      btn.classList.remove("bg-emerald-50","border-emerald-400","ring-2","ring-emerald-100","text-emerald-800");
      btn.classList.add("bg-white","border-slate-200","text-slate-700");
      if (dot){
        dot.classList.add("border-slate-300");
        dot.classList.remove("border-emerald-500");
        dot.innerHTML = '';
      }
    }
  });
}

function updateHeaderProgress(){
  const totalQ = TOTAL_LIKERT_ITEMS + DEMOGRAPHICS.length;
  const answeredQ = totalAnsweredCount() + demographicsAnsweredCount();
  const pct = Math.round((answeredQ / totalQ) * 100);
  const bar = document.getElementById("header-progress");
  if (bar) bar.style.width = pct + "%";
}

function updateStepperCounts(){
  const aChip = document.querySelector('.stepper-chip[data-step="A"]');
  if (aChip){
    const aDone = demographicsAnsweredCount();
    aChip.textContent = "A · " + aDone + "/" + DEMOGRAPHICS.length;
    if (state.step !== 'A'){
      aChip.className = "stepper-chip shrink-0 px-2.5 py-1 rounded-md text-[11px] font-semibold border transition " + (isDemographicComplete() ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-white text-slate-500 border-slate-200");
    }
  }
  for (const s of SECTIONS){
    const chip = document.querySelector('.stepper-chip[data-step="'+s.id+'"]');
    if (!chip) continue;
    const n = sectionAnsweredCount(s.id), t = sectionItemCount(s.id);
    chip.textContent = s.id + " · " + n + "/" + t;
    if (state.step === s.id) continue; // don't override active styling
    const done = n===t;
    chip.className = "stepper-chip shrink-0 px-2.5 py-1 rounded-md text-[11px] font-semibold border transition " + (done ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-white text-slate-500 border-slate-200");
  }
  // Footer count text
  const footerText = document.querySelector("footer .text-xs.text-slate-500");
  if (footerText){
    if (state.step === 'A'){
      footerText.textContent = demographicsAnsweredCount() + "/" + DEMOGRAPHICS.length + " dijawab";
    } else {
      const sec = SECTIONS.find(s => s.id === state.step);
      if (sec) footerText.textContent = sectionAnsweredCount(sec.id) + "/" + sectionItemCount(sec.id) + " item dijawab";
    }
  }
}

/* -------------------------- Event delegation ------------------------------ */
function wireDemoInputs(root){
  root = root || document;
  // text/select inputs
  root.querySelectorAll('[data-demo]').forEach(el => {
    const code = el.getAttribute("data-demo");
    if (el.tagName === "SELECT"){
      el.onchange = () => setDemo(code, el.value);
    } else {
      el.oninput = () => {
        state.demographics[code] = el.value;
        saveState();
        updateHeaderProgress();
      };
    }
  });
  // radio cards
  root.querySelectorAll('[data-demo-radio]').forEach(btn => {
    const code = btn.getAttribute("data-demo-radio");
    const val = btn.getAttribute("data-value");
    btn.onclick = () => {
      setDemo(code, val);
      updateRadioCards(code);
    };
  });
  // likert pills
  root.querySelectorAll('[data-pill]').forEach(btn => {
    const code = btn.getAttribute("data-pill");
    const val = parseInt(btn.getAttribute("data-value"), 10);
    btn.onclick = () => setResp(code, val);
  });
}

/* --------------------------- Navigation ----------------------------------- */
function goToStep(step){
  state.step = step;
  saveState();
  render();
  wireDemoInputs();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goNext(){
  if (state.step === "A"){
    if (!isDemographicComplete()){
      toast("Sila lengkapkan semua maklumat demografi terlebih dahulu.","warn");
      return;
    }
    goToStep("B"); return;
  }
  if (state.step === "F"){
    // submit handled separately
    return;
  }
  // Section B..E -> next section
  const idx = SECTIONS.findIndex(s => s.id === state.step);
  if (idx >= 0 && idx < SECTIONS.length - 1){
    // Warn if section incomplete but allow forward
    if (!isSectionComplete(state.step)){
      const n = sectionAnsweredCount(state.step), t = sectionItemCount(state.step);
      if (!confirm("Bahagian ini belum lengkap (" + n + "/" + t + " item). Teruskan ke bahagian seterusnya?")){
        return;
      }
    }
    goToStep(SECTIONS[idx+1].id);
  }
}

async function submitSurvey(){
  if (!isDemographicComplete()){
    toast("Demografi belum lengkap.","warn");
    goToStep("A"); return;
  }
  for (const s of SECTIONS){
    if (!isSectionComplete(s.id)){
      if (!confirm("Bahagian " + s.id + " belum lengkap. Hantar jawapan seperti adanya?")) return;
    }
  }
  if (!state.submissionId) state.submissionId = newSubmissionId();
  saveState();
  toast("Menyimpan jawapan…","info");
  const r = await syncToSheet(state.submissionId, state.demographics, state.responses);
  state.synced = r.ok;
  saveState();
  if (r.ok) toast("Jawapan dihantar ke Google Sheet.","success");
  else toast("Disimpan secara setempat. Anda boleh cuba segarkan semula nanti.","warn");
  goToStep("done");
}

function escapeHtml(s){
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
