<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Semak Pelajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Note: removed transform from fadeIn to avoid any horizontal shift
           during the animation that could make the slip look "senget". */
        .progress-anim { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift { transition: all 0.2s ease; }
        .hover-lift:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; border-radius: 16px; max-width: 480px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-header { padding: 20px 24px 0; text-align: center; flex-shrink: 0; }
        .modal-body { padding: 16px 24px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px 24px 20px; border-top: 1px solid #e2e8f0; flex-shrink: 0; }

        #toast-container { position: fixed; top: 22px; right: 22px; z-index: 300; width: min(390px, calc(100vw - 32px)); display: grid; gap: 10px; pointer-events: none; }
        .app-toast { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid; border-radius: 12px; background: white; box-shadow: 0 16px 35px rgba(15,23,42,.16); animation: toastIn .25s ease-out; pointer-events: auto; }
        .app-toast.success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
        .app-toast.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .app-toast.warning { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
        .app-toast.info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
        .app-toast .toast-icon { width: 22px; height: 22px; flex: 0 0 auto; margin-top: 1px; }
        .app-toast .toast-title { font-size: .875rem; font-weight: 700; line-height: 1.25rem; }
        .app-toast .toast-message { font-size: .8rem; line-height: 1.2rem; margin-top: 1px; opacity: .92; }
        .app-toast.toast-out { opacity: 0; transform: translateX(18px); transition: all .22s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }

        :root {
            --primary: #0f766e;
            --primary-dark: #0d5f59;
            --primary-light: #ccfbf1;
            --ink: #172033;
            --muted: #667085;
            --line: #dfe5ec;
            --canvas: #f5f7fa;
            --amber: #d97706;
            --amber-light: #fef3c7;
            --red: #dc2626;
            --red-light: #fee2e2;
        }
        body { background: var(--canvas); color: var(--ink); }
        body::before { content: ''; position: fixed; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--primary-dark), var(--primary)); z-index: 200; }

        .scale-options { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
        .scale-opt { position: relative; }
        .scale-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
        .scale-opt span {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 12px; border-radius: 8px; font-size: .7rem; font-weight: 600;
            border: 2px solid #e2e8f0; color: #64748b; cursor: pointer;
            transition: all 0.2s ease; user-select: none; white-space: nowrap;
        }
        .scale-opt span:hover { border-color: #94a3b8; background: #f8fafc; }
        .scale-opt input:checked + span.s0 { background: #ecfdf5; border-color: #10b981; color: #065f46; box-shadow: 0 2px 8px rgba(16,185,129,0.2); }
        .scale-opt input:checked + span.s1 { background: #eff6ff; border-color: #3b82f6; color: #1e40af; box-shadow: 0 2px 8px rgba(59,130,246,0.2); }
        .scale-opt input:checked + span.s2 { background: var(--amber-light); border-color: var(--amber); color: #92400e; box-shadow: 0 2px 8px rgba(217,119,6,0.2); }
        .scale-opt input:checked + span.s3 { background: var(--red-light); border-color: var(--red); color: #991b1b; box-shadow: 0 2px 8px rgba(220,38,38,0.2); }

        .question-row { display: grid !important; grid-template-columns: 36px minmax(0,1fr) auto; align-items: center !important; gap: 10px; }
        @media (max-width: 640px) {
            .question-row { grid-template-columns: 28px minmax(0,1fr); gap: 6px !important; }
            .question-row > .scale-options { grid-column: 1 / -1; justify-self: start; padding-left: 34px; }
        }
        .item-unanswered { animation: pulseBorder 1.5s ease-in-out 2; }
        @keyframes pulseBorder { 0%,100% { border-color: #e2e8f0; } 50% { border-color: #f87171; } }

        .domain-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .7rem; font-weight: 700; letter-spacing: .02em; }

        /* === PRINT / PDF OPTIMIZATION === */
        @media print {
            .no-print { display: none !important; }
            body { background: #ffffff !important; }
            body::before { display: none !important; }
            /* Hide the on-screen colored banner header from the PDF */
            #app > header,
            #app-header,
            #app-survey-banner { display: none !important; }
            #app { padding: 0 !important; max-width: 100% !important; }
            #result-slip { padding: 0 !important; gap: 10px !important; }
            #result-slip > * { box-shadow: none !important; }
            /* Keep each card intact across page breaks */
            /* Big section containers default to avoiding breaks, but we tag
               certain sections (D, E) with .allow-break so their content
               can flow across pages naturally. Inner cards inside them
               still avoid breaking. */
            #result-slip .bg-white,
            #result-slip .chart-wrap,
            #result-slip table,
            #result-slip tr,
            #result-slip .interp-card { page-break-inside: avoid !important; break-inside: avoid !important; }
            #result-slip .allow-break { page-break-inside: auto !important; break-inside: auto !important; }
            /* Show page header & footer only in PDF / print */
            .slip-page-header,
            .slip-page-footer { display: block !important; }
            /* Hide on-screen-only chrome that lives outside #result-slip */
            #nav-container,
            #progress-bar-container { display: none !important; }
        }

        /* === STRENGTHEN ALL PASTEL TAILWIND COLOURS INSIDE THE RESULT SLIP ===
           These rules apply on screen AND in PDF so the slip always looks
           vivid (not pudar). Scoped to #result-slip so survey pages are
           unaffected. */
        #result-slip { background: #ffffff; }

        /* --- FIX: Text colours — guna warna lebih gelap (-600/-700) supaya jelas --- */
        #result-slip .text-slate-400  { color: #475569 !important; }
        #result-slip .text-slate-300  { color: #64748b !important; }
        #result-slip .text-slate-500  { color: #334155 !important; }
        #result-slip .text-slate-600  { color: #334155 !important; }
        #result-slip .text-slate-700  { color: #1e293b !important; }
        #result-slip .text-emerald-400 { color: #065f46 !important; }
        #result-slip .text-emerald-600 { color: #065f46 !important; }
        #result-slip .text-emerald-700 { color: #064e3b !important; }
        #result-slip .text-emerald-800 { color: #064e3b !important; }
        #result-slip .text-amber-400  { color: #92400e !important; }
        #result-slip .text-amber-600  { color: #92400e !important; }
        #result-slip .text-amber-700  { color: #78350f !important; }
        #result-slip .text-amber-800  { color: #78350f !important; }
        #result-slip .text-amber-900  { color: #57330c !important; }
        #result-slip .text-red-400    { color: #991b1b !important; }
        #result-slip .text-red-600    { color: #991b1b !important; }
        #result-slip .text-red-700    { color: #7f1d1d !important; }
        #result-slip .text-red-800    { color: #7f1d1d !important; }
        #result-slip .text-red-900    { color: #641e1e !important; }
        #result-slip .text-blue-700   { color: #1d4ed8 !important; }
        #result-slip .text-teal-600   { color: #0d5f59 !important; }
        #result-slip .text-teal-700   { color: #0d5f59 !important; }

        /* --- FIX: Background colours — guna warna lebih gelap supaya tidak pudar --- */
        #result-slip .bg-emerald-50  { background-color: #a7f3d0 !important; }
        #result-slip .bg-amber-50    { background-color: #fde68a !important; }
        #result-slip .bg-red-50      { background-color: #fecaca !important; }
        #result-slip .bg-slate-50    { background-color: #e2e8f0 !important; }
        #result-slip .bg-slate-100   { background-color: #cbd5e1 !important; }
        #result-slip .bg-emerald-100 { background-color: #6ee7b7 !important; }
        #result-slip .bg-amber-100   { background-color: #fcd34d !important; }
        #result-slip .bg-red-100     { background-color: #fca5a5 !important; }
        #result-slip .bg-teal-50     { background-color: #99f6e4 !important; }
        #result-slip .bg-teal-100    { background-color: #5eead4 !important; }
        #result-slip .bg-blue-100    { background-color: #93c5fd !important; }
        #result-slip .bg-green-50    { background-color: #bbf7d0 !important; }

        /* --- FIX: Border colours — lebih gelap supaya kelihatan jelas --- */
        #result-slip .border-slate-100  { border-color: #cbd5e1 !important; }
        #result-slip .border-slate-200  { border-color: #94a3b8 !important; }
        #result-slip .border-slate-300  { border-color: #64748b !important; }
        #result-slip .border-emerald-300 { border-color: #059669 !important; }
        #result-slip .border-amber-300  { border-color: #d97706 !important; }
        #result-slip .border-red-300    { border-color: #dc2626 !important; }
        #result-slip .border-teal-200   { border-color: #14b8a6 !important; }

        /* --- FIX: Pill badges — guna -300 untuk kontras lebih baik --- */
        #result-slip .bg-emerald-200 { background-color: #34d399 !important; }
        #result-slip .bg-amber-200   { background-color: #fbbf24 !important; }
        #result-slip .bg-red-200     { background-color: #f87171 !important; }

        /* --- Stronger borders for stat boxes so they don't fade --- */
        #result-slip .border-emerald-300 { border-width: 1.5px !important; }
        #result-slip .border-amber-300   { border-width: 1.5px !important; }
        #result-slip .border-red-300     { border-width: 1.5px !important; }

        /* Page header & footer - visible on screen AND in PDF */
        .slip-page-header,
        .slip-page-footer { display: block; }

        /* Survey banner: visible by default on screen, hidden when result slip
           is shown (body.phase-results) and always hidden in PDF/print. */
        #app-survey-banner { display: block; }
        body.phase-results #app-survey-banner { display: none !important; }

        /* When showing the result slip: switch body to white background so the
           slip doesn't sit on the gray --canvas (which made it look shifted/
           misaligned). Also ensure #app centers the slip properly. */
        body.phase-results { background: #ffffff !important; }
        body.phase-results #app {
            max-width: 900px !important;
            margin: 0 auto !important;
            padding: 24px 16px 80px !important;
        }
        body.phase-results #main-content {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        body.phase-results #result-slip {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Chart container gets a stronger border so it doesn't fade into white */
        #result-slip .chart-wrap {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
        }
    
        /* === OFFICIAL PDF HEADER (simple centered, no logo) === */
        .ssp-header {
            text-align: center;
            padding: 6px 12px 6px;
            border-bottom: 3px double #0f766e;
            margin-bottom: 6px;
        }
        .ssp-header .ssp-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 4px;
            font-size: 0.65rem;
            color: #475569;
            line-height: 1.5;
        }
        .ssp-header .ssp-meta .meta-label {
            color: #94a3b8;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .ssp-header .ssp-meta .meta-value {
            font-weight: 700;
            color: #1f2937;
        }

        /* === COUNSELOR REFERRAL CALLOUT === */
        .counselor-callout {
            background: linear-gradient(90deg, #ecfdf5 0%, #f0fdfa 100%);
            border: 1px solid #14b8a6;
            border-left: 4px solid #0f766e;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .counselor-callout .callout-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            background: #0f766e;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            margin-top: 1px;
        }
        .counselor-callout .callout-body {
            font-size: 0.78rem;
            color: #0f766e;
            line-height: 1.45;
            font-weight: 500;
        }
        .counselor-callout .callout-body strong {
            color: #134e4a;
            font-weight: 700;
        }

        /* === COUNSELOR SIGNATURE BLOCK === */
        .signature-block {
            margin-top: 8px;
            padding: 10px 14px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        .signature-block .sig-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .signature-block .sig-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 10px;
            align-items: start;
        }
        .signature-block .sig-statement {
            font-size: 0.6rem;
            color: #475569;
            line-height: 1.4;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .signature-block .sig-chop-area {
            height: 48px;
            border: 1px dashed #94a3b8;
            border-radius: 6px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            font-size: 0.58rem;
            font-style: italic;
            margin-bottom: 6px;
        }
        .signature-block .sig-chop-area .chop-label {
            text-align: center;
            line-height: 1.3;
        }
        .signature-block .sig-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #475569;
            padding-bottom: 1px;
            margin-top: 5px;
            font-size: 0.62rem;
            min-height: 14px;
        }
        .signature-block .sig-line .sig-label {
            color: #64748b;
            font-weight: 500;
        }
        .signature-block .sig-line .sig-value {
            color: #1f2937;
            font-weight: 600;
        }
        .signature-block .sig-footer-line {
            margin-top: 8px;
            padding-top: 5px;
            border-top: 1px solid #cbd5e1;
            font-size: 0.58rem;
            color: #94a3b8;
            text-align: center;
            font-style: italic;
        }
        @media print {
            .signature-block,
            .counselor-callout { page-break-inside: avoid !important; }
        }
        </style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="toast-container" class="no-print" aria-live="polite" aria-atomic="true"></div>
<div id="app" class="max-w-5xl mx-auto px-4 py-6 pb-24">
    <div id="progress-bar-container" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 hidden">
        <div class="flex justify-between items-center mb-2">
            <span id="progress-text" class="text-sm font-semibold text-slate-700">Pendaftaran Maklumat</span>
            <span id="progress-percent" class="text-sm font-bold text-teal-600">0%</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div id="progress-fill" class="bg-teal-600 h-2.5 rounded-full progress-anim" style="width:0%"></div>
        </div>
    </div>

        // Draw chart as a HORIZONTAL bar chart so long construct labels

    // ─── CORE LOGIC ─────────────────────────────────────────────────────

    selectItem(idx, val) {
        this.answers.items[idx] = val;
        const row = document.getElementById('qrow_' + idx);
        if (row) row.classList.remove('item-unanswered');
    },

    validateInventoryPage() {
        const startIdx = this.section * ITEMS_PER_PAGE;
        const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, MOONEY_ITEMS.length);
        let firstUnanswered = -1;
        for (let i = startIdx; i < endIdx; i++) {
            if (this.answers.items[i] === undefined || this.answers.items[i] === null) {
                firstUnanswered = i;
                break;
            }
        }
        if (firstUnanswered >= 0) {
            const row = document.getElementById('qrow_' + firstUnanswered);
            if (row) {
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                row.classList.add('item-unanswered');
            }
            this.notify('error', 'Item Belum Dijawab', `Sila jawab item ${firstUnanswered + 1} sebelum meneruskan. Semua item pada halaman ini mesti memilih satu tahap.`);
            return false;
        }
        return true;
    },

    getTahap(score) {
        if (score <= 10) return { tahap: 'Rendah', color: 'bg-emerald-100 text-emerald-700', barBg: 'bg-emerald-500', textColor: 'text-emerald-700', border: 'border-emerald-200', interpretasi: 'Tiada atau sangat sedikit masalah dalam konstruk tersebut. Intervensi khusus tidak diperlukan, namun pemantauan berkala digalakkan.' };
        if (score <= 20) return { tahap: 'Sederhana', color: 'bg-amber-100 text-amber-700', barBg: 'bg-amber-500', textColor: 'text-amber-700', border: 'border-amber-200', interpretasi: 'Menunjukkan terdapat beberapa isu yang mula mempengaruhi kesejahteraan pelajar. Digalakkan mengikuti aktiviti pembangunan diri, bimbingan atau intervensi awal.' };
        return { tahap: 'Tinggi', color: 'bg-red-100 text-red-700', barBg: 'bg-red-500', textColor: 'text-red-700', border: 'border-red-200', interpretasi: 'Menunjukkan pelajar menghadapi masalah yang ketara dalam konstruk tersebut. Disarankan menjalani sesi bimbingan atau kaunseling bagi mendapatkan bantuan lanjut.' };
    },

    calcScores() {
        const scores = {};
        MOONEY_DOMAINS.forEach((d, idx) => {
            const start = idx * 10;
            let s0 = 0, s1 = 0, s2 = 0, s3 = 0;
            for (let i = start; i < start + 10; i++) {
                const v = this.answers.items[i];
                if (v === 0) s0++; else if (v === 1) s1++; else if (v === 2) s2++; else if (v === 3) s3++;
            }
            scores[d.key] = { s0, s1, s2, s3, total: s2 + s3, totalScore: (s1 * 1) + (s2 * 2) + (s3 * 3) };
        });
        return scores;
    },

    saveRegister() {
        DEMO_QUESTIONS.forEach(q => {
            if (q.type === 'radio') {
                const el = document.querySelector(`input[name="a_${q.id}"]:checked`);
                if (el) this.answers.A[q.id] = el.value;
            } else {
                const el = document.getElementById('a_' + q.id);
                if (el) this.answers.A[q.id] = el.value;
            }
        });
    },

    validateRegister() {
        for (const q of DEMO_QUESTIONS) {
            if (!q.required) continue;
            let val = q.type === 'radio'
                ? document.querySelector(`input[name="a_${q.id}"]:checked`)?.value
                : document.getElementById(`a_${q.id}`)?.value;
            if (!val || !val.trim()) {
                this.showValidation(`Sila lengkapkan: ${q.label}`, q.type === 'radio' ? `input[name="a_${q.id}"]` : `#a_${q.id}`);
                return false;
            }
            // Validasi format khusus
            const v = val.trim();
            if (q.id === 'kad_pengenalan') {
                if (!/^[0-9]+$/.test(v)) {
                    this.showValidation('No. Kad Pengenalan mesti mengandungi nombor sahaja.', '#a_kad_pengenalan');
                    return false;
                }
                if (v.length < 12 || v.length > 14) {
                    this.showValidation('No. Kad Pengenalan mesti mempunyai 12 hingga 14 digit.', '#a_kad_pengenalan');
                    return false;
                }
            }
            if (q.id === 'telefon') {
                if (!/^[0-9]+$/.test(v)) {
                    this.showValidation('No. Telefon mesti mengandungi nombor sahaja.', '#a_telefon');
                    return false;
                }
                if (v.length < 10 || v.length > 15) {
                    this.showValidation('No. Telefon mesti mempunyai 10 hingga 15 digit.', '#a_telefon');
                    return false;
                }
            }
            if (q.id === 'emel') {
                if (!/^[^@]+@[^@]+\.[^@]+$/.test(v)) {
                    this.showValidation('Format emel tidak sah. Contoh: nama@domain.com', '#a_emel');
                    return false;
                }
            }
        }
        return true;
    },

    // ─── NAVIGATION ─────────────────────────────────────────────────────

    async next() {
        if (this.phase === 'register') {
            if (!this.validateRegister()) return;
            this.saveRegister();
            this.phase = 'confirm';
            this.renderConfirm();
            this.updateProgress();
            return;
        }
        if (this.phase === 'confirm') {
            // Check for duplicate IC before allowing to proceed
            const ic = this.answers.A.kad_pengenalan;
            if (ic && ic.trim()) {
                this.setForwardLoading(true);
                try {
                    const isDuplicate = await this.checkDuplicateIC(ic.trim());
                    this.setForwardLoading(false);
                    if (isDuplicate) {
                        this.notify('error', 'No. Kad Pengenalan Telah Wujud', 'Rekod dengan No. Kad Pengenalan ini sudah berada dalam sistem. Setiap pelajar hanya dibenarkan menjawab sekali sahaja. Sila hubungi pentadbir jika anda memerlukan bantuan.');
                        return;
                    }
                } catch (err) {
                    this.setForwardLoading(false);
                }
            }
            this.phase = 'inventory';
            this.section = 0;
            this.renderInventoryPage();
            this.updateProgress();
            return;
        }
        if (this.phase === 'inventory') {
            if (!this.validateInventoryPage()) return;
            if (this.section < TOTAL_ITEM_PAGES - 1) {
                this.section++;
                this.renderInventoryPage();
                this.updateProgress();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                await this.submitCompletedRecord();
                this.phase = 'results';
                this.renderResults();
                this.openModal('modal-complete');
            }
        }
    },

    prev() {
        if (this.phase === 'inventory' && this.section > 0) {
            this.section--;
            this.renderInventoryPage();
            this.updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (this.phase === 'confirm') {
            this.phase = 'register';
            this.renderRegister();
            this.updateProgress();
        } else if (this.phase === 'inventory' && this.section === 0) {
            this.phase = 'register';
            this.renderRegister();
            this.updateProgress();
        }
    },

    updateProgress() {
        let pct, label;
        if (this.phase === 'register') {
            pct = 5; label = 'Pendaftaran Maklumat';
        } else if (this.phase === 'confirm') {
            pct = 8; label = 'Pengesahan Maklumat';
        } else if (this.phase === 'inventory') {
            pct = Math.round(((this.section + 1) / TOTAL_STEPS) * 90) + 5;
            label = `Senarai Semak — Muka ${this.section + 1} / ${TOTAL_ITEM_PAGES}`;
        } else {
            pct = 100; label = 'Selesai';
        }
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-percent').textContent = pct + '%';
        document.getElementById('progress-text').textContent = label;
        document.getElementById('btn-back').classList.toggle('hidden', this.phase === 'register' || this.phase === 'confirm');
        const isLast = (this.phase === 'inventory' && this.section === TOTAL_ITEM_PAGES - 1);
        const isConfirm = this.phase === 'confirm';
        const isReg = this.phase === 'register';
        if (isConfirm) {
            document.getElementById('btn-forward').innerHTML = '<span class="flex items-center gap-2">Sahkan & Mula<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></span>';
        } else if (isReg) {
            document.getElementById('btn-forward').innerHTML = '<span class="flex items-center gap-2">Daftar<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>';
        } else if (isLast) {
            document.getElementById('btn-forward').innerHTML = '<span class="flex items-center gap-2">Hantar & Lihat Keputusan<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></span>';
        } else {
            document.getElementById('btn-forward').innerHTML = '<span class="flex items-center gap-2">Seterusnya<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>';
        }
    },

    // ─── IC DUPLICATE CHECK (Firestore) ────────────────────────

    async checkDuplicateIC(ic) {
        if (!db) {
            this.notify('error', 'Ralat', 'Firebase belum bersedia. Sila semak konfigurasi.');
            return true;
        }
        try {
            const doc = await db.collection('ssp_ic_registry').doc(ic).get();
            return doc.exists;
        } catch (err) {
            console.error('IC check error:', err);
            return false;
        }
    },

    // ─── RETRIEVE RESULTS BY IC (Muat Turun Keputusan) ─────────────

    openRetrieveModal() {
        document.getElementById('retrieve-ic-input').value = '';
        document.getElementById('retrieve-error').classList.add('hidden');
        document.getElementById('retrieve-loading').classList.add('hidden');
        document.getElementById('retrieve-form').classList.remove('hidden');
        const btn = document.getElementById('btn-retrieve-search');
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg> Cari & Muat Turun';
        this.openModal('modal-retrieve');
        setTimeout(() => document.getElementById('retrieve-ic-input').focus(), 350);
    },

    async retrieveResultsByIC() {
        const input = document.getElementById('retrieve-ic-input');
        const ic = (input ? input.value : '').trim();
        const errorBox = document.getElementById('retrieve-error');

        // Validate IC input
        if (!ic) {
            errorBox.textContent = 'Sila masukkan No. Kad Pengenalan anda.';
            errorBox.classList.remove('hidden');
            input.focus();
            return;
        }
        if (!/^[0-9]+$/.test(ic)) {
            errorBox.textContent = 'No. Kad Pengenalan mesti mengandungi nombor sahaja.';
            errorBox.classList.remove('hidden');
            input.focus();
            return;
        }
        if (ic.length < 12 || ic.length > 14) {
            errorBox.textContent = 'No. Kad Pengenalan mesti mempunyai 12 hingga 14 digit.';
            errorBox.classList.remove('hidden');
            input.focus();
            return;
        }

        // Hide error, show loading
        errorBox.classList.add('hidden');
        document.getElementById('retrieve-form').classList.add('hidden');
        document.getElementById('retrieve-loading').classList.remove('hidden');

        const btn = document.getElementById('btn-retrieve-search');
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');

        if (!db) {
            document.getElementById('retrieve-form').classList.remove('hidden');
            document.getElementById('retrieve-loading').classList.add('hidden');
            errorBox.textContent = 'Firebase belum bersedia. Sila semak konfigurasi dan cuba lagi.';
            errorBox.classList.remove('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            return;
        }

        try {
            console.log('[Retrieve] Mencari registry untuk IC:', ic);
            // Step 1: Get the IC registry document
            const registryDoc = await db.collection('ssp_ic_registry').doc(ic).get();
            if (!registryDoc.exists) {
                console.log('[Retrieve] IC tidak dijumpai dalam registry:', ic);
                document.getElementById('retrieve-form').classList.remove('hidden');
                document.getElementById('retrieve-loading').classList.add('hidden');
                errorBox.innerHTML = '<strong>Tiada rekod dijumpai.</strong><br>Tiada rekod SSP yang didaftarkan dengan No. Kad Pengenalan ini. Sila pastikan nombor yang dimasukkan adalah betul atau hubungi pentadbir jika anda memerlukan bantuan.';
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                return;
            }

            const registryData = registryDoc.data();
            console.log('[Retrieve] Registry dijumpai:', registryData);
            const responseDocId = registryData.responseDocId;

            // Step 2: Get the actual response document using the stored doc ID
            if (!responseDocId) {
                // Rekod lama (sebelum kod dikemaskini) tiada responseDocId.
                // Pelajar perlu hubungi pentadbir untuk mengemas kini rekod.
                console.log('[Retrieve] Tiada responseDocId dalam registry — rekod lama');
                document.getElementById('retrieve-form').classList.remove('hidden');
                document.getElementById('retrieve-loading').classList.add('hidden');
                errorBox.innerHTML = '<strong>Rekod SSP perlu dikemas kini.</strong><br>No. Kad Pengenalan ini telah didaftarkan, tetapi rekod adalah dari versi sistem lama. Sila hubungi <strong>Kaunselor Pendidikan IPG</strong> atau pentadbir supaya mereka boleh mengemas kini rekod anda untuk membolehkan muat turun keputusan secara dalam talian.';
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                return;
            }

            // Get the response document directly by ID
            console.log('[Retrieve] Mencari response doc ID:', responseDocId);
            const responseDoc = await db.collection('ssp_responses').doc(responseDocId).get();
            if (!responseDoc.exists) {
                console.log('[Retrieve] Response doc tidak wujud:', responseDocId);
                document.getElementById('retrieve-form').classList.remove('hidden');
                document.getElementById('retrieve-loading').classList.add('hidden');
                errorBox.innerHTML = '<strong>Rekod jawapan SSP tidak dijumpai.</strong><br>Data jawapan mungkin telah dipadam atau belum selesai. Sila hubungi pentadbir untuk bantuan lanjut.';
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                return;
            }

            const data = responseDoc.data();
            console.log('[Retrieve] Berjaya memuatkan data untuk:', data.nama || 'tidak bernama');
            this.closeModal('modal-retrieve');
            this.loadRetrievedResults(data);

        } catch (err) {
            console.error('[Retrieve] Ralat lengkap:', err.code, err.message, err);
            document.getElementById('retrieve-form').classList.remove('hidden');
            document.getElementById('retrieve-loading').classList.add('hidden');
            let msg = 'Sila semak sambungan internet dan cuba lagi.';
            if (err.code === 'permission-denied') {
                msg = 'Akses ditolak oleh Security Rules Firestore. Sila pastikan kedua-dua koleksi <strong>ssp_ic_registry</strong> dan <strong>ssp_responses</strong> membenarkan <strong>read</strong> (bacaan). Hubungi pentadbir sistem untuk mengemas kini Firestore Rules.';
            } else if (err.code === 'unavailable') {
                msg = 'Perkhidmatan pangkalan data tidak tersedia. Sila cuba sebentar lagi.';
            } else {
                msg += ' (Kod ralat: ' + (err.code || err.message) + ')';
            }
            errorBox.innerHTML = '<strong>Gagal mencari keputusan.</strong><br>' + msg;
            errorBox.classList.remove('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    },

    loadRetrievedResults(data) {
        // Populate answers.A from retrieved data
        this.answers.A = {
            nama: data.nama || '',
            kad_pengenalan: data.kad_pengenalan || '',
            no_matrik: data.no_matrik || '',
            emel: data.emel || '',
            jantina: data.jantina || '',
            bangsa: data.bangsa || '',
            agama: data.agama || '',
            telefon: data.telefon || '',
            ipg: data.ipg || '',
            program: data.program || '',
            bidang: data.bidang || ''
        };

        // Populate answers.items from retrieved data
        const items = data.items || [];
        for (let i = 0; i < 110; i++) {
            this.answers.items[i] = (items[i] !== undefined && items[i] !== null) ? items[i] : 0;
        }

        // Set phase to results and render
        this.phase = 'results';
        this.renderResults();
        this.notify('success', 'Keputusan Dijumpai', 'Keputusan SSP anda telah berjaya dimuatkan. Anda kini boleh muat turun atau cetak slip keputusan.');
    },

    setForwardLoading(loading) {
        const btn = document.getElementById('btn-forward');
        if (!btn) return;
        if (loading) {
            btn.disabled = true;
            btn.dataset.originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="flex items-center gap-2"><svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>Semakan No. KP...</span>';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    },

        // ─── SUBMIT KE FIRESTORE ─────────────────────────────────

    async submitCompletedRecord() {
        if (!db) {
            this.notify('error', 'Ralat', 'Firebase belum bersedia. Data tidak dapat disimpan.');
            return;
        }
        this.notify('info', 'Sedang Dihantar', 'Sila tunggu, maklumat anda sedang direkodkan...');
        const scores = this.calcScores();
        const itemsArr = [];
        for (let i = 0; i < 110; i++) itemsArr.push(this.answers.items[i] !== undefined ? this.answers.items[i] : null);
        const unanswered = itemsArr.filter(v => v === null).length;
        if (unanswered > 0) {
            this.notify('error', 'Data Tidak Lengkap', 'Terdapat ' + unanswered + ' item yang belum dijawab.');
            return;
        }
        const ic = this.answers.A.kad_pengenalan.trim();
        const kodKampus = IPG_KOD_KAMPUS[this.answers.A.ipg] || '';
        const studentData = {
            nama: this.answers.A.nama || '',
            kad_pengenalan: ic,
            no_matrik: this.answers.A.no_matrik || '',
            emel: this.answers.A.emel || '',
            jantina: this.answers.A.jantina || '',
            bangsa: this.answers.A.bangsa || '',
            agama: this.answers.A.agama || '',
            telefon: this.answers.A.telefon || '',
            ipg: this.answers.A.ipg || '',
            kodKampus: kodKampus,
            program: this.answers.A.program || '',
            bidang: this.answers.A.bidang || '',
            items: itemsArr,
            scores: scores,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        try {
            const responseRef = await db.collection('ssp_responses').add(studentData);
            console.log('ssp_responses berjaya ditulis — Doc ID:', responseRef.id);
            await db.collection('ssp_ic_registry').doc(ic).set({
                kad_pengenalan: ic,
                nama: this.answers.A.nama || '',
                ipg: this.answers.A.ipg || '',
                kodKampus: kodKampus,
                responseDocId: responseRef.id,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('ssp_ic_registry berjaya ditulis');
            this.notify('success', 'Berjaya Dihantar', 'Maklumat senarai semak telah berjaya disimpan di database.');
        } catch (err) {
            console.error('Submit error:', err.code, err.message);
            let msg = 'Sila semak sambungan internet dan cuba lagi.';
            if (err.code === 'permission-denied') {
                msg = 'Akses ditolak oleh Security Rules. Sila semak konfigurasi keselamatan pangkalan data untuk ssp_responses dan ssp_ic_registry.';
            } else if (err.code === 'unavailable') {
                msg = 'Perkhidmatan pangkalan data tidak tersedia. Pastikan fail HTML dibuka melalui pelayan web (localhost) atau HTTPS, bukan terus dari fail (file://).';
            }
            this.notify('error', 'Gagal Dihantar', msg);
        }
    },

    // ─── UTILITIES ──────────────────────────────────────────────────────

    resetAll() {
        this.closeModal('modal-complete');
        this.phase = 'welcome';
        this.section = 0;
        this.answers = { A: {}, items: {} };
        this.renderWelcome();
    },

    showNav() { document.getElementById('nav-container').classList.remove('hidden'); },
    hideNav() { document.getElementById('nav-container').classList.add('hidden'); },
    showProgress() { document.getElementById('progress-bar-container').classList.remove('hidden'); },
    hideProgress() { document.getElementById('progress-bar-container').classList.add('hidden'); },

    notify(type, title, message) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const isSuccess = type === 'success';
        toast.className = `app-toast ${type}`;
        toast.setAttribute('role', isSuccess ? 'status' : 'alert');
        toast.innerHTML = `
            <svg class="toast-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                ${type === 'success'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>'
                    : type === 'error'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>'
                    : type === 'warning'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'
                }
            </svg>
            <div><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div>`;
        container.appendChild(toast);
        window.setTimeout(() => {
            toast.classList.add('toast-out');
            window.setTimeout(() => toast.remove(), 240);
        }, 4200);
    },

    showValidation(message, selector) {
        const target = selector ? document.querySelector(selector) : null;
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const box = target.closest('.question-row, div');
            if (box) {
                box.classList.add('ring-2','ring-red-200','border-red-400');
                setTimeout(() => box.classList.remove('ring-2','ring-red-200','border-red-400'), 1800);
            }
        }
        this.notify('error', 'Maklumat belum lengkap', message);
    },

    openModal(id) { document.getElementById(id).classList.add('active'); },
    closeModal(id) { document.getElementById(id).classList.remove('active'); },

    async downloadPDF() {
        try {
            const element = document.getElementById('result-slip');
            if (!element) { this.notify('error', 'Ralat', 'Slip keputusan tidak dijumpai.'); return; }
            if (typeof html2pdf === 'undefined') { this.notify('error', 'Pustaka PDF Gagal Dimuatkan', 'Sila pastikan sambungan internet anda stabil.'); return; }
            const name = (this.answers.A.nama || 'PELAJAR').replace(/[^a-zA-Z0-9_\-]+/g, '_');
            this.notify('info', 'Sila Tunggu', 'PDF sedang dijana, jangan tutup tetingkap ini...');

            // ==============================================================
            // FIX CHART HILANG: Tukar canvas Chart.js kepada imej statik
            // SEBELUM clone. cloneNode(true) TIDAK menyalin data piksel
            // canvas — carta akan keluar kosong dalam PDF.
            // ==============================================================
            const originalCanvas = element.querySelector('#mooneyBarChart');
            let chartImageSrc = null;
            if (originalCanvas) {
                try { chartImageSrc = originalCanvas.toDataURL('image/jpeg', 0.5); } catch(e) { console.warn('Chart toDataURL failed:', e); }
            }

            // Clone the slip so we can apply PDF-only styles without touching
            // the on-screen version.
            const clone = element.cloneNode(true);

            // FIX CHART: Ganti canvas clone dengan imej statik
            if (chartImageSrc) {
                const clonedCanvas = clone.querySelector('#mooneyBarChart');
                if (clonedCanvas) {
                    const img = document.createElement('img');
                    img.src = chartImageSrc;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    img.style.display = 'block';
                    clonedCanvas.parentNode.replaceChild(img, clonedCanvas);
                }
            }

            // Force-show the page header / footer that are hidden on screen
            clone.querySelectorAll('.slip-page-header, .slip-page-footer').forEach(el => {
                el.style.display = 'block';
            });

            // Hide everything marked no-print inside the clone
            clone.querySelectorAll('.no-print').forEach(el => { el.style.display = 'none'; });

            // FIX: Anggar lebar kandungan A4 (210mm - 16mm margin = 194mm ≈ 733px @96dpi)
            const A4_CONTENT_WIDTH = 733;

            // ==============================================================
            // FIX SENGET: Paksa semua responsive Tailwind class supaya aktif.
            // html2canvas TIDAK menyokong media queries — semua md:*, sm:*
            // class tidak akan aktif. Kita mesti set style inline satu per satu.
            // ==============================================================

            // md:grid-cols-2 → 2 columns (umum)
            clone.querySelectorAll('[class*="md:grid-cols-2"]').forEach(el => {
                el.style.gridTemplateColumns = '1fr 1fr';
            });
            // md:grid-cols-4 → 4 columns  (Ringkasan Keseluruhan)
            clone.querySelectorAll('[class*="md:grid-cols-4"]').forEach(el => {
                el.style.gridTemplateColumns = 'repeat(4, 1fr)';
            });
            // md:col-span-2 → span 2 columns
            clone.querySelectorAll('[class*="md:col-span-2"]').forEach(el => {
                el.style.gridColumn = 'span 2 / span 2';
            });
            // md:flex-row → row direction
            clone.querySelectorAll('[class*="md:flex-row"]').forEach(el => {
                el.style.flexDirection = 'row';
            });

            // ==============================================================
            // FIX TEKS TERKELUAR: Section D (Analisis Tahap Mengikut Konstruk)
            // mempunyai grid 2-col (chart | jadual). Jadual 6 lajur terlalu
            // sempit dalam ~366px. Tukar ke 1-col supaya carta di atas,
            // jadual di bawah — guna lebar penuh 733px.
            // ==============================================================
            clone.querySelectorAll('.allow-break').forEach(section => {
                const grid = section.querySelector('[class*="md:grid-cols-2"]');
                if (grid) {
                    grid.style.gridTemplateColumns = '1fr';
                }
                // Kecilkan tinggi chart wrapper supaya tidak terlalu besar
                const chartWrap = section.querySelector('.chart-wrap');
                if (chartWrap) {
                    chartWrap.style.height = '300px';
                    chartWrap.style.maxHeight = '300px';
                }
            });

            // FIX: Pastikan clone sendiri memenuhi lebar wrapper dan centre.
            clone.style.width = '100%';
            clone.style.maxWidth = '100%';
            clone.style.margin = '0';
            clone.style.padding = '0';
            clone.style.boxSizing = 'border-box';

            // FIX: Pastikan semua grid children mempunyai width yang betul
            clone.querySelectorAll('[class*="grid"]').forEach(el => {
                el.style.width = '100%';
            });

            // FIX: Pastikan jadual tidak melebihi lebar container
            clone.querySelectorAll('table').forEach(el => {
                el.style.width = '100%';
                el.style.tableLayout = 'fixed';
            });

            // Wrap in a white-bg container so html2canvas never paints the
            // pale --canvas background (root cause of "pudar").
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `
                background: #ffffff;
                padding: 0;
                width: ${A4_CONTENT_WIDTH}px;
                margin: 0;
                box-sizing: border-box;
                position: fixed;
                left: 0;
                top: 0;
                z-index: -9999;
                opacity: 0;
                pointer-events: none;
            `;
            wrapper.appendChild(clone);

            // Attach to document so html2canvas can measure/layout correctly
            document.body.appendChild(wrapper);

            try {
                await html2pdf().set({
                    margin: [8, 8, 10, 8],
                    filename: `SLIP_Senarai_Semak_${name}.pdf`,
                    // FIX: Tukar dari jpeg ke png — PNG tidak kehilangan warna
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: {
                        scale: 1,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        scrollX: 0,
                        scrollY: 0,
                        // FIX: Guna lebar tetap A4 supaya centre sempurna.
                        // x dan y = 0 supaya html2canvas bermula dari tepi kiri clone.
                        x: 0,
                        y: 0,
                        width: A4_CONTENT_WIDTH,
                        windowWidth: A4_CONTENT_WIDTH
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['css', 'legacy'], avoid: ['table', 'tr', '.bg-white', '.chart-wrap'] }
                }).from(clone).save();
            } finally {
                document.body.removeChild(wrapper);
            }
        } catch (error) {
            console.error('PDF Error:', error);
            this.notify('error', 'Gagal Jana PDF', 'Berlaku ralat. Sila gunakan pelayar Chrome/Firefox terkini.');
        }
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
